name: Publish content

on:
  push:
    branches: [content]

concurrency:
  group: content-publish
  cancel-in-progress: false # never drop a publish; queue them

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write # to dispatch the syndication workflow after publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can merge and push back
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Work on the branch tip, then sync main into content
        # Queued publishes may trail the branch tip, and code changes land on
        # main — validate new notes against the current site code, not a
        # stale snapshot.
        run: |
          git fetch origin main content
          git checkout -B content origin/content
          git merge --no-edit origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Normalize frontmatter and sort inbox into category folders
        # Fails (and blocks the merge to main) if any note has a missing or
        # unknown category; the failure issue below flags it.
        run: npm run sort-inbox

      - name: Reconcile shelf queue stubs
        # A shelf note that just arrived from the inbox may be the "real"
        # entry for something already sitting on the shelf as a `todo`
        # queue stub (Obsidian-first promotion — see
        # planning/shelf-queue-design.md §4). Delete the matching stub so
        # it doesn't render twice; near-title-mismatches are only logged,
        # never auto-deleted.
        run: npm run reconcile-shelf-queue

      - name: Validate
        # TODO: flip to a required step once brief 06 (TypeScript hygiene)
        # brings `npx astro check` to zero errors.
        continue-on-error: true
        run: npx astro check

      - name: Commit normalized content to content branch
        run: |
          git add src/content/
          git diff --staged --quiet || git commit -m "chore: normalize and sort published notes"
          git push origin content

      - name: Merge to main
        id: merge
        # Pushes made with GITHUB_TOKEN do not trigger other workflows, but
        # Cloudflare's GitHub App webhook still fires — exactly one production
        # build per publish, no workflow cascade.
        run: |
          if git diff --quiet origin/main content; then
            echo "Content tree is identical to main; nothing to publish."
            exit 0
          fi
          git checkout -B main origin/main
          git merge --no-ff content -m "publish: content batch $(date -u +%Y-%m-%dT%H:%M)"
          # A /write micro post can land on main mid-run; merge it and retry
          # rather than failing the publish
          git push origin main || {
            git fetch origin main
            git merge --no-edit origin/main
            git push origin main
          }
          echo "published=true" >> "$GITHUB_OUTPUT"
          # Fast-forward content to the merge commit so it never trails main.
          # If a new note landed on content mid-run this isn't a fast-forward;
          # skip — the push that brought the note will publish and re-sync.
          git push origin main:content ||
            echo "content moved during this run; the next publish will sync it"

      - name: Trigger syndication
        # This workflow's merge is pushed with GITHUB_TOKEN, which never
        # fires push-triggered workflows — but an explicit workflow_dispatch
        # is exempt from that recursion guard, so dispatch syndication here.
        if: steps.merge.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'syndicate-content.yml',
              ref: 'main',
              inputs: { wait_for_deploy: 'true' },
            })

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Content publish failed — notes not deployed',
              body: [
                'The **Publish content** workflow failed, so the pushed notes were NOT merged to `main` or deployed.',
                '',
                'Most common cause: a note in `src/content/inbox/` with a missing or unknown `category` frontmatter field.',
                'Fix the note and push to `content` again — the workflow will re-run automatically.',
                '',
                `**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              ].join('\n'),
              labels: ['automation', 'inbox'],
            })
