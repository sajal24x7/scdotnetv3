name: Publish content

# GitSync pushes Obsidian notes into src/content/inbox/ on main. Cloudflare
# ignores inbox-only pushes (build watch paths exclude src/content/inbox/*),
# so nothing builds until this run sorts the notes and commits them.
on:
  push:
    branches: [main]
    paths:
      - 'src/content/inbox/**'
  workflow_dispatch:

concurrency:
  group: content-publish
  cancel-in-progress: false # never drop a publish; queue them

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Queued runs may trail the branch tip; always work on the latest main
          ref: main

      - name: Configure git
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Normalize frontmatter and sort inbox into category folders
        # Fails if any note has a missing or unknown category. The notes
        # stay in the inbox and the issue below flags it.
        run: npm run sort-inbox

      - name: Reconcile shelf queue stubs
        # Delete a `todo` queue stub when its real shelf entry just arrived
        # (see planning/shelf-queue-design.md §4).
        run: npm run reconcile-shelf-queue

      - name: Commit sorted notes to main
        # Pushes made with GITHUB_TOKEN do not trigger other workflows, but
        # Cloudflare's GitHub App webhook still fires: one build per publish.
        run: |
          git add -A src/content/
          if git diff --staged --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "publish: content batch $(date -u +%Y-%m-%dT%H:%M)"
          # A /write post or another sync can land mid-run; rebase and retry
          git push origin main || {
            git pull --rebase origin main
            git push origin main
          }

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Content publish failed — notes not deployed',
              body: [
                'The **Publish content** workflow failed, so the notes in `src/content/inbox/` were NOT published.',
                '',
                'Most common cause: a note with a missing or unknown `category` frontmatter field.',
                'Fix the note in Obsidian and run the shortcut again. The workflow re-runs on the next inbox push.',
                '',
                `**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              ].join('\n'),
              labels: ['automation', 'inbox'],
            })
