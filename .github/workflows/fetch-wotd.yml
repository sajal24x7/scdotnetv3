name: Fetch Word of the Day

# Daily pull of Merriam-Webster's Word of the Day into
# src/data/vocab.generated.json for the /learn/vocabulary deck. M-W is the
# single source and the script adds at most one word per run, so the deck
# grows exactly one word a day. It's idempotent (word-keyed, skips words
# already on file), so a re-run is harmless and a missed day is picked up
# tomorrow rather than lost.
on:
  schedule:
    - cron: '5 9 * * *' # After M-W's word rolls over (it publishes ~00:01 ET)

  workflow_dispatch:

concurrency:
  group: fetch-wotd
  cancel-in-progress: false

jobs:
  fetch-wotd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch today's word
        run: node scripts/fetch-wotd.mjs

      - name: Commit new vocabulary
        run: |
          if git diff --quiet -- src/data/vocab.generated.json && git diff --staged --quiet -- src/data/vocab.generated.json; then
            echo "No new words today"
            exit 0
          fi

          git add src/data/vocab.generated.json

          git commit -m "Add today's Word of the Day

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git pull --rebase origin main
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Fetch Word of the Day workflow failed',
              body: `The fetch-wotd workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
