name: Download Film Posters

on:
  # Run after successful deployment
  repository_dispatch:
    types: [deploy-success]

  # Manual trigger for downloading posters
  workflow_dispatch:

  # Run daily to catch any new films/shows
  schedule:
    - cron: '0 3 * * *' # Every day at 3 AM UTC

jobs:
  download-posters:
    # Prevent infinite loops from bot commits
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history to commit back changes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Download missing film posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run download-posters

      - name: Generate TypeScript imports
        run: npm run generate-posters

      - name: Commit film poster updates
        run: |
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new film posters to commit"
            exit 0
          fi

          # Add all changed files
          git add src/images/filmshelf/ src/utils/filmCovers.ts src/content/

          # Commit with message
          git commit -m "Download and add film posters

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Push changes back to main branch
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Film poster download workflow failed',
              body: `The film poster download workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.

              Common issues:
              - TMDB_API_KEY secret not set
              - API rate limiting`,
              labels: ['bug', 'automation']
            })
