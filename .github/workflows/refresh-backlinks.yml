name: Refresh backlinks index

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *' # Daily at 4:30 AM UTC

jobs:
  refresh:
    # Prevent infinite loops from bot commits
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history to commit back changes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Rebuild backlinks index
        env:
          REGENERATE_BACKLINKS: 'true'
        run: npm run build

      - name: Commit backlinks index if it changed
        run: |
          if git diff --quiet -- src/data/backlinks-index.json; then
            echo "Backlinks index unchanged, nothing to commit"
            exit 0
          fi

          git add src/data/backlinks-index.json
          git commit -m "chore: refresh backlinks index"

          # Rebase on top of any commits that landed while this job ran, then push
          git pull --rebase origin main
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Backlinks index refresh workflow failed',
              body: `The backlinks index refresh workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
