name: CI

# PR-only: pushes to main are already built by Cloudflare, and a merged PR
# was validated by its pull_request run minutes earlier — a second build of
# the same tree on push was pure Actions-minutes waste.
on:
  pull_request:

# Explicit minimal scope: this runs on fork PRs, so don't inherit whatever
# the repo's default GITHUB_TOKEN permissions happen to be.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          # the build script does not invoke syndication today, but if that ever
          # changes, make sure CI can never publish to social platforms
          SYNDICATION_DRY_RUN: 'true'

      - name: Feed sanity — every RSS item must carry pubDate
        run: |
          test -f dist/rss.xml
          items=$(grep -c "<item>" dist/rss.xml)
          dates=$(grep -c "<pubDate>" dist/rss.xml)
          echo "items=$items pubDates=$dates"
          [ "$items" -eq "$dates" ]
