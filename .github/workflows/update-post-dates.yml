name: Update Post Dates

on:
  push:
    branches: [main]
    paths:
      - 'src/content/**/*.md'
      - 'src/content/**/*.mdx'

jobs:
  update-dates:
    # Prevent infinite loops: skip commits made by this bot
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need current + previous commit for diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Get commit timestamp
        id: commit-info
        run: |
          COMMIT_TIME=$(git log -1 --format='%cI' HEAD)
          echo "timestamp=$COMMIT_TIME" >> $GITHUB_OUTPUT
          echo "Commit timestamp: $COMMIT_TIME"

      - name: Find modified content files
        id: changed-files
        run: |
          # --diff-filter=M selects only Modified files, excluding Added (new posts),
          # Deleted, and Renamed — so we never stamp a brand-new post with an updatedDate.
          # Also skip the inbox/ staging area which isn't published content.
          git diff --name-only --diff-filter=M HEAD~1 HEAD -- 'src/content/' \
            | grep -E '\.(md|mdx)$' \
            | grep -v '^src/content/inbox/' \
            > /tmp/modified_content_files.txt || true

          if [ -s /tmp/modified_content_files.txt ]; then
            echo "has_files=true" >> $GITHUB_OUTPUT
            echo "Modified content files:"
            cat /tmp/modified_content_files.txt
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No modified content files — nothing to do"
          fi

      - name: Update updated in frontmatter
        if: steps.changed-files.outputs.has_files == 'true'
        run: node scripts/update-post-dates.js
        env:
          COMMIT_TIMESTAMP: ${{ steps.commit-info.outputs.timestamp }}
          MODIFIED_FILES_PATH: /tmp/modified_content_files.txt

      - name: Commit date updates
        if: steps.changed-files.outputs.has_files == 'true'
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "No frontmatter changes to commit"
            exit 0
          fi

          git add src/content/
          git commit -m "chore: update updated for modified posts

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Update post dates workflow failed',
              body: `The update-post-dates workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
