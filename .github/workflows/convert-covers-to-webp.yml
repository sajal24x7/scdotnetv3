name: Convert Covers to WebP

# Manual-only: converts JPG/PNG cover images to WebP (e.g. after manually
# dropping a cover into an images folder that a downloader couldn't find)
# and updates any markdown `cover:` frontmatter reference to match. See
# docs/tools/book-cover-downloader.md#converting-manually-added-covers.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder to convert, relative to repo root (e.g. src/images/bookshelf). Leave blank to convert all 4 shelves.'
        required: false
        default: ''
        type: string

jobs:
  convert-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history to rebase before pushing back
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Convert images to WebP
        run: |
          if [ -n "${{ inputs.folder }}" ]; then
            node scripts/convert-covers-to-webp.js --dir "${{ inputs.folder }}"
          else
            node scripts/convert-covers-to-webp.js
          fi

      - name: Regenerate TypeScript cover imports
        run: |
          node scripts/generate-book-covers.js
          node scripts/generate-film-covers.js
          node scripts/generate-tv-covers.js
          node scripts/generate-game-covers.js

      - name: Commit converted covers
        run: |
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No images to convert"
            exit 0
          fi

          git add src/images/ src/utils/ src/content/

          git commit -m "Convert covers to WebP

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Rebase on top of any commits that landed while this job ran
          # (e.g. syndication or a content publish), then push back to main
          git pull --rebase origin main
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Convert Covers to WebP workflow failed',
              body: `The Convert Covers to WebP workflow failed on ${new Date().toISOString()}.

              **Folder input:** \`${{ inputs.folder }}\`
              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
