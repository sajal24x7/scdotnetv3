name: Download Book Covers

on:
  # Run after successful deployment
  repository_dispatch:
    types: [deploy-success]

  # Automatically run on commits to the default branch
  push:
    branches: [main]
    paths:
      - 'src/content/**/*.md'

  # Manual trigger for downloading covers
  workflow_dispatch:

  # Run weekly to catch any missed covers
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM UTC

jobs:
  download-covers:
    # Prevent infinite loops from bot commits
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history to commit back changes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Download missing book covers
        run: npm run download-covers

      - name: Generate TypeScript imports
        run: npm run generate-covers

      - name: Commit book cover updates
        run: |
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new book covers to commit"
            exit 0
          fi

          # Add all changed files
          git add src/images/bookshelf/ src/utils/bookCovers.ts src/content/

          # Commit with message
          git commit -m "Download and add book covers

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Push changes back to main branch
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Book cover download workflow failed',
              body: `The book cover download workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
