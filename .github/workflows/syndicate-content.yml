name: Syndicate Content

on:
  # Run after successful deployment
  repository_dispatch:
    types: [deploy-success]

  # Automatically run on commits to the default branch
  push:
    branches: [main]
    paths:
      - 'src/content/**/*.md'
      - 'src/content/**/*.mdx'

  # Manual trigger for testing/catch-up
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual posting)'
        required: false
        default: 'false'
        type: boolean
      days_back:
        description: 'Number of days back to check for posts'
        required: false
        default: '7'
        type: string

# Serialise all syndication runs. Every push fires two triggers back-to-back:
# the push trigger immediately, then repository_dispatch once Cloudflare deploys.
# Without this, both runs start before either saves syndicationUrls and the same
# post gets published to every platform twice. cancel-in-progress: false means
# the second run waits rather than being dropped, so retries still happen.
concurrency:
  group: syndication
  cancel-in-progress: false

jobs:
  syndicate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history to commit back changes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run syndication
        env:
          # Mastodon credentials
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}

          # Bluesky credentials
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

          # Threads credentials
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

          # Configuration
          SYNDICATION_DRY_RUN: ${{ github.event.inputs.dry_run || github.event.client_payload.dry_run || 'false' }}
          SYNDICATION_DAYS_BACK: ${{ github.event.inputs.days_back || github.event.client_payload.days_back || '7' }}
        run: node scripts/syndicate-content.js

      - name: Commit syndication updates
        run: |
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Add all changed files
          git add .

          # Commit with message
          git commit -m "Update syndication URLs

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Rebase on top of any commits that landed while this job ran
          # (e.g. from update-post-dates running in parallel). Without this,
          # a concurrent push causes git push to fail and syndicationUrls are
          # never saved, so the next trigger posts to the same platforms again.
          git pull --rebase origin main
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Syndication workflow failed',
              body: `The syndication workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
