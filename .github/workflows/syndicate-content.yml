name: Syndicate Content

on:
  # Run after successful deployment (full 7-day scan for catch-up)
  repository_dispatch:
    types: [deploy-success]

  # Run when new content files are added — only processes the newly added files,
  # not all posts from the last 7 days. This prevents a post with a failing
  # platform (e.g. Threads API down) from being retried on every push.
  push:
    branches: [main]
    paths:
      - 'src/content/**/*.md'
      - 'src/content/**/*.mdx'

  # Manual trigger for testing/catch-up (full 7-day scan)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual posting)'
        required: false
        default: 'false'
        type: boolean
      days_back:
        description: 'Number of days back to check for posts'
        required: false
        default: '7'
        type: string

jobs:
  syndicate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history to commit back changes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Detect new content files
        if: github.event_name == 'push'
        run: |
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'src/content/' \
            | grep -E '\.(md|mdx)$' \
            | grep -v '^src/content/inbox/' \
            > /tmp/new_syndication_targets.txt || true

          if [ -s /tmp/new_syndication_targets.txt ]; then
            echo "New content files to syndicate:"
            cat /tmp/new_syndication_targets.txt
          else
            echo "No new content files added in this push — nothing to syndicate"
          fi

      - name: Run syndication
        env:
          # Mastodon credentials
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}

          # Bluesky credentials
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

          # Threads credentials
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

          # Configuration
          SYNDICATION_DRY_RUN: ${{ github.event.inputs.dry_run || github.event.client_payload.dry_run || 'false' }}
          SYNDICATION_DAYS_BACK: ${{ github.event.inputs.days_back || github.event.client_payload.days_back || '7' }}
          # On push events, restrict syndication to newly added files only.
          # Empty for repository_dispatch and workflow_dispatch (full 7-day scan).
          SYNDICATION_NEW_FILES_PATH: ${{ github.event_name == 'push' && '/tmp/new_syndication_targets.txt' || '' }}
        run: node scripts/syndicate-content.js

      - name: Commit syndication updates
        run: |
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Add all changed files
          git add .

          # Commit with message
          git commit -m "Update syndication URLs

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Push changes back to main branch
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Syndication workflow failed',
              body: `The syndication workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
