name: Syndicate Content

on:
  # Run once Cloudflare Pages reports a deploy result. The Cloudflare Pages
  # GitHub App creates deployments/deployment statuses natively, and (unlike
  # a push trigger) this also fires for the bot merge from content-publish,
  # because Cloudflare's webhook is not subject to GitHub's GITHUB_TOKEN
  # recursion guard. Syndicating after the deploy also guarantees the
  # canonical URL is live before anything is posted.
  deployment_status:

  # Manual trigger for testing/catch-up
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual posting)'
        required: false
        default: 'false'
        type: boolean
      days_back:
        description: 'Number of days back to check for posts'
        required: false
        default: '7'
        type: string

# Serialise syndication runs so two overlapping runs can never post the same
# note twice before either saves syndicationUrls. With the old double
# push + repository_dispatch triggers gone this is mostly insurance, but a
# manual dispatch can still overlap a deploy-triggered run.
concurrency:
  group: syndication
  cancel-in-progress: false

jobs:
  syndicate:
    # Only production deploy successes count. If syndication ever stops
    # firing, check the `environment` string in a real deployment event
    # payload — Cloudflare Pages uses "Production" or the Pages project name
    # depending on integration vintage.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(fromJSON('["Production", "production"]'), github.event.deployment.environment))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # deployment_status events check out the deployed SHA by default;
          # we need the main branch itself to commit syndicationUrls back
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run syndication
        env:
          # Mastodon credentials
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}

          # Bluesky credentials
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

          # Threads credentials
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

          # Configuration
          SYNDICATION_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SYNDICATION_DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}
        run: node scripts/syndicate-content.js

      - name: Commit syndication updates
        run: |
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Add all changed files
          git add .

          # [CI Skip] tells Cloudflare Pages not to build for this
          # bookkeeping commit; the syndication links render with the next
          # publish instead of costing a build of their own.
          git commit -m "Update syndication URLs [CI Skip]

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Rebase on top of any commits that landed while this job ran
          # (e.g. a cover download run). Without this, a concurrent push
          # causes git push to fail and syndicationUrls are never saved, so
          # the next trigger posts to the same platforms again.
          git pull --rebase origin main
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Syndication workflow failed',
              body: `The syndication workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
