name: Syndicate Content

on:
  # Fire on direct content pushes to main: the /write composer, manual
  # pushes, PR merges. This replaces the deployment_status trigger — this
  # repo's Cloudflare integration never creates GitHub deployment events,
  # so that trigger never fired once (post 202607091101 went unsyndicated).
  # No loop: the syndicationUrls bookkeeping commit below is pushed with
  # GITHUB_TOKEN, which GitHub's recursion guard excludes from push
  # triggers. Bot merges from content-publish also can't fire this push
  # trigger, so that workflow dispatches this one explicitly instead.
  push:
    branches: [main]
    paths:
      - 'src/content/**/*.md'
      - 'src/content/**/*.mdx'

  # Manual trigger for testing/catch-up
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual posting)'
        required: false
        default: 'false'
        type: boolean
      days_back:
        description: 'Number of days back to check for posts'
        required: false
        default: '7'
        type: string
      wait_for_deploy:
        description: 'Wait for the Cloudflare deploy before posting (set by content-publish)'
        required: false
        default: 'false'
        type: boolean

# Serialise syndication runs so two overlapping runs can never post the same
# note twice before either saves syndicationUrls (e.g. a push-triggered run
# overlapping a dispatch from content-publish or a manual dispatch).
concurrency:
  group: syndication
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always work on the branch tip so the syndicationUrls commit
          # lands on current main, not the pushed SHA
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for the Cloudflare deploy
        # Cloudflare builds the pushed commit in parallel with this job.
        # Give the deploy a head start so the canonical URL is (very likely)
        # live before anything links to it from Mastodon/Bluesky/Threads.
        if: github.event_name == 'push' || inputs.wait_for_deploy == true
        run: sleep 120

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run syndication
        env:
          # Mastodon credentials
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}

          # Bluesky credentials
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

          # Threads credentials
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

          # Instagram credentials (photo posts only; separate token from Threads)
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

          # Configuration
          SYNDICATION_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SYNDICATION_DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}
        run: node scripts/syndicate-content.js

      - name: Send outgoing webmentions
        # "Be a good citizen": notify sites this post links to. Fetches the
        # live pages itself (hence after the deploy wait above) rather than
        # working from local content, so it needs no extra credentials.
        env:
          WEBMENTIONS_DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}
        run: node scripts/send-webmentions.js

      - name: Commit syndication updates
        id: commit
        run: |
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

          # Add all changed files
          git add .

          # [CI Skip] tells Cloudflare Pages not to build for this
          # bookkeeping commit; the syndication links render with the next
          # publish instead of costing a build of their own.
          git commit -m "Update syndication URLs [CI Skip]

          🤖 Generated with GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Rebase on top of any commits that landed while this job ran
          # (e.g. a cover download run). Without this, a concurrent push
          # causes git push to fail and syndicationUrls are never saved, so
          # the next trigger posts to the same platforms again.
          git pull --rebase origin main
          git push origin main

      - name: Keep the content branch in sync with main
        # The syndicationUrls commit is pushed with GITHUB_TOKEN, so the
        # sync-content-branch workflow won't fire for it — sync inline
        # instead, or the content branch ends up one commit behind main.
        # Skipped when nothing was committed: the push that triggered this
        # run also triggered sync-content-branch, which handles that case.
        if: steps.commit.outputs.committed == 'true'
        run: |
          if ! git fetch origin content; then
            echo "No content branch — nothing to sync"
            exit 0
          fi
          git checkout -B content origin/content
          if git merge --no-edit origin/main; then
            git push origin content
          else
            git merge --abort
            echo "::warning::content branch has conflicting changes; the next content-publish run will reconcile it"
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Syndication workflow failed',
              body: `The syndication workflow failed on ${new Date().toISOString()}.

              **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Please check the logs and fix any issues.`,
              labels: ['bug', 'automation']
            })
