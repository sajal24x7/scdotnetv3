name: Create micro post

# Publish a micro post straight to src/content/micro/ on main.
# Designed to be dispatched from a phone (Apple Shortcut) — see
# docs/operations/micro-posting.md for the shortcut setup.

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'The post (markdown)'
        required: true
        type: string
      title:
        description: 'Post title (leave empty for a title-less micro post)'
        required: false
        type: string
      tags:
        description: 'Comma-separated tags'
        required: false
        type: string

concurrency:
  group: micro-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create post file
        id: create
        env:
          MICRO_TEXT: ${{ inputs.text }}
          MICRO_TITLE: ${{ inputs.title }}
          MICRO_TAGS: ${{ inputs.tags }}
        run: node scripts/create-micro-post.mjs

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/micro/
          git commit -m "Add micro post: ${{ steps.create.outputs.filename }}"

          # Retry with rebase in case another workflow pushed to main meanwhile
          for i in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, rebasing and retrying ($i/3)..."
            git pull --rebase origin main
            sleep 2
          done
          git push origin main

      # Pushes made with GITHUB_TOKEN don't fire on:push workflows,
      # so kick off syndication explicitly (it also runs again after
      # the Cloudflare deploy via the deploy-success dispatch).
      - name: Trigger syndication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run syndicate-content.yml --ref main
